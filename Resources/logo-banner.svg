<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" height="100%">
  <defs>
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05141e"/>
      <stop offset="50%" stop-color="#061a26"/>
      <stop offset="100%" stop-color="#02090e"/>
    </linearGradient>

    <linearGradient id="banner-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <linearGradient id="shield-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2338"/>
      <stop offset="100%" stop-color="#06121d"/>
    </linearGradient>

    <filter id="banner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect x="2" y="2" width="856" height="216" rx="24" fill="url(#banner-bg)" stroke="url(#banner-border)" stroke-width="2"/>

  <!-- Subtle Accent Grid lines -->
  <line x1="200" y1="2" x2="200" y2="218" stroke="#00e5ff" stroke-opacity="0.06" stroke-width="1"/>
  <circle cx="105" cy="110" r="140" fill="none" stroke="#00e5ff" stroke-opacity="0.04" stroke-width="1.5" stroke-dasharray="4 8"/>

  <!-- Left Side: Mini App Icon Squircle Lockup -->
  <g transform="translate(30, 30)">
    <!-- Squircle base -->
    <rect x="0" y="0" width="160" height="160" rx="36" fill="#081520" stroke="#00e5ff" stroke-width="2" filter="url(#banner-glow)"/>

    <!-- Scaled Shield Artwork (Center at 80, 80) -->
    <g transform="translate(8, 8) scale(1.33)">
      <!-- Outer Shield Shadow -->
      <path d="M54,23 L79,34 C79,59 69,76 54,85 C39,76 29,59 29,34 Z" fill="#0a3c52" opacity="0.6"/>

      <!-- Shield Outer Armor Plate -->
      <path d="M54,25 L76,35 C76,57 67,73 54,82 C41,73 32,57 32,35 Z" fill="url(#shield-armor)" stroke="#00e5ff" stroke-width="2" stroke-linejoin="round"/>

      <!-- Inner Shield Inset -->
      <path d="M54,30 L71,38 C71,55 64,68 54,75 C44,68 37,55 37,38 Z" fill="#13334c"/>

      <!-- Right-half Shading -->
      <path d="M54,30 L71,38 C71,55 64,68 54,75 Z" fill="#0b1c2a" opacity="0.8"/>

      <!-- Central Hexagonal Circuit -->
      <path d="M44,42 L54,36 L64,42" fill="none" stroke="#00f5d4" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Outer Node Ring / Eye -->
      <circle cx="54" cy="52" r="7" fill="none" stroke="#00e5ff" stroke-width="2"/>

      <!-- Glowing Core Center -->
      <circle cx="54" cy="52" r="4" fill="#00f5d4"/>

      <!-- Vertical Data Beam / Armor Spine -->
      <line x1="54" y1="61" x2="54" y2="71" stroke="#00f5d4" stroke-width="2" stroke-linecap="round"/>

      <!-- Lateral Circuit Traces -->
      <line x1="47" y1="52" x2="40" y2="52" stroke="#00b4d8" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="61" y1="52" x2="68" y2="52" stroke="#00b4d8" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="46" y1="65" x2="40" y2="68" stroke="#00b4d8" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="62" y1="65" x2="68" y2="68" stroke="#00b4d8" stroke-width="1.2" stroke-linecap="round"/>

      <!-- Circuit Connection Dots -->
      <circle cx="39.5" cy="52" r="1.5" fill="#00f5d4"/>
      <circle cx="68.5" cy="52" r="1.5" fill="#00f5d4"/>
      <circle cx="54" cy="72" r="1.5" fill="#00e5ff"/>
    </g>
  </g>

  <!-- Right Side: Brand Lockup & Typography -->
  <g transform="translate(225, 45)">
    <!-- Top Pill Category -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="186" height="24" rx="12" fill="rgba(0, 229, 255, 0.12)" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1"/>
      <circle cx="12" cy="12" r="4" fill="#10b981"/>
      <text x="24" y="16" fill="#00e5ff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Roboto', 'Helvetica Neue', sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">ANDROID ENDPOINT AUDIT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Roboto', 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.03em">
      <tspan fill="#ffffff">Droid</tspan><tspan fill="url(#text-gradient)">Sentinel</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Roboto', sans-serif" font-size="14.5" font-weight="500">
      Native, point-in-time, read-only mobile security evidence snapshot engine
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 118)">
      <!-- Badge 1: Read-Only Evidence -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="124" height="22" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
        <text x="62" y="15" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Roboto', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">🔒 100% Read-Only</text>
      </g>

      <!-- Badge 2: Zero Telemetry -->
      <g transform="translate(132, 0)">
        <rect x="0" y="0" width="122" height="22" rx="6" fill="rgba(0, 229, 255, 0.1)" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1"/>
        <text x="61" y="15" fill="#00e5ff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Roboto', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">⚡ Zero Telemetry</text>
      </g>

      <!-- Badge 3: Android 13+ -->
      <g transform="translate(262, 0)">
        <rect x="0" y="0" width="148" height="22" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
        <text x="74" y="15" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Roboto', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">🤖 Android 13+ (API 33-37)</text>
      </g>

      <!-- Badge 4: Kotlin / Compose -->
      <g transform="translate(418, 0)">
        <rect x="0" y="0" width="118" height="22" rx="6" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1"/>
        <text x="59" y="15" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Roboto', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Kotlin Compose</text>
      </g>
    </g>
  </g>
</svg>